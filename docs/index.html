<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="VELTRIX AI، دستیار هوشمند گفت‌وگو به زبان فارسی و انگلیسی.">
<title>VELTRIX AI | دستیار هوشمند</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141d32;--line:#293752;--text:#f2f5ff;--muted:#a9b5ca;--cyan:#70e1f5;--purple:#a78bfa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#26376b 0,transparent 48%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
main{max-width:850px;margin:auto;padding:24px 16px 36px}.top{text-align:center;padding:22px 0 16px}.logo{font-size:30px;font-weight:900;letter-spacing:1px;color:var(--cyan)}.sub{color:var(--muted);font-size:14px}
.chat{border:1px solid var(--line);background:#0e1729d9;border-radius:22px;overflow:hidden;box-shadow:0 20px 70px #0005}.chathead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.dot{width:10px;height:10px;border-radius:50%;background:#4ade80;box-shadow:0 0 12px #4ade80}.chathead small{color:var(--muted);margin-right:auto}
.messages{height:min(56vh,520px);min-height:310px;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:13px}.msg{max-width:88%;padding:12px 15px;border-radius:16px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}.bot{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-bottom-right-radius:5px}.user{background:linear-gradient(120deg,#155e75,#5141a4);align-self:flex-end;border-bottom-left-radius:5px}.msg a{color:var(--cyan);text-decoration:underline}.composer{display:flex;gap:9px;padding:14px;border-top:1px solid var(--line)}input{min-width:0;flex:1;background:#0a1222;border:1px solid var(--line);border-radius:13px;padding:14px;color:var(--text);font:inherit;outline:none}input:focus{border-color:var(--cyan)}button{border:0;border-radius:13px;padding:0 22px;background:linear-gradient(110deg,#0891b2,#6d5ce7);color:white;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.suggestions{display:flex;flex-wrap:wrap;gap:8px;padding:0 15px 15px}.suggestions button{background:#17243b;border:1px solid var(--line);padding:8px 12px;font-size:12px;font-weight:normal}.note{text-align:center;color:#8290aa;font-size:11px;margin-top:13px}
@media(max-width:520px){main{padding:12px}.messages{height:58vh}.composer{padding:10px}button{padding:0 16px}}
</style></head>
<body><main>
<header class="top"><div class="logo">VELTRIX AI</div><div class="sub">دستیار گفت‌وگویی هوشمند · فارسی و انگلیسی</div></header>
<section class="chat" aria-label="گفت‌وگو با VELTRIX AI">
<div class="chathead"><span class="dot"></span><strong>گفت‌وگوی جدید</strong><small>نسخهٔ آزمایشی</small></div>
<div class="messages" id="messages" aria-live="polite"><div class="msg bot">سلام! 👋 من VELTRIX AI هستم. خوشحالم باهات گفت‌وگو کنم. چه کاری از دستم برمیاد؟</div></div>
<div class="suggestions"><button type="button" data-prompt="سلام، چطوری؟">سلام 👋</button><button type="button" data-prompt="یه سایت خوب برای یادگیری برنامه‌نویسی معرفی کن">معرفی سایت</button><button type="button" data-prompt="تو چه کارهایی می‌تونی انجام بدی؟">قابلیت‌ها</button></div>
<form class="composer" id="form"><input id="prompt" autocomplete="off" placeholder="پیامت رو بنویس..." aria-label="پیام شما"><button id="send" type="submit">ارسال</button></form>
</section>
<p class="note">این نسخه یک نمونهٔ اولیهٔ گفت‌وگو است؛ پاسخ‌ها فعلاً از قواعد داخلی می‌آیند و هنوز به یک مدل زبانی بزرگ متصل نیستند.</p>
</main>
<script>
const messages=document.getElementById('messages'),input=document.getElementById('prompt'),form=document.getElementById('form');
function add(text,who){const el=document.createElement('div');el.className='msg '+who;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;}
function norm(s){return s.toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u064B-\u065F\u0670]/g,'').replace(/[؟?!،,.؛:ـ\u200c]/g,' ').replace(/\s+/g,' ').trim();}
function has(q,words){return words.some(w=>q.includes(w));}
function websiteCode(){return 'قالب شروع وب‌سایت (فایل index.html):\n\n<!doctype html>\n<html lang="fa" dir="rtl">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>وب‌سایت من</title>\n<style>body{margin:0;font-family:Tahoma;background:#101827;color:white;padding:24px}main{max-width:700px;margin:8vh auto;background:#1d2a40;padding:32px;border-radius:18px}button{padding:12px 22px;border:0;border-radius:10px;background:#38bdf8;cursor:pointer}</style>\n</head>\n<body><main><h1>سلام! به سایت من خوش آمدی</h1><p>این اولین صفحه وب من است.</p><button id="hello">کلیک کن</button><p id="result"></p></main>\n<script>document.getElementById("hello").addEventListener("click",()=>document.getElementById("result").textContent="دکمه درست کار می‌کند!");<\\/script>\n</body></html>\n\nکد را در فایل index.html ذخیره و با مرورگر باز کن. برای پروژه واقعی، امکانات و طراحی موردنظرت را هم بگو.';}
function pythonCode(){return 'ماشین‌حساب پایتون (calculator.py):\n\ndef calculator():\n    while True:\n        first = input("عدد اول (برای خروج q): ")\n        if first.lower() == "q": break\n        op = input("عملگر (+, -, *, /): ")\n        second = input("عدد دوم: ")\n        try:\n            a, b = float(first), float(second)\n            if op == "+": result = a + b\n            elif op == "-": result = a - b\n            elif op == "*": result = a * b\n            elif op == "/":\n                if b == 0: print("تقسیم بر صفر مجاز نیست"); continue\n                result = a / b\n            else: print("عملگر نامعتبر"); continue\n            print("نتیجه:", result)\n        except ValueError: print("لطفاً عدد معتبر وارد کن")\n\nif __name__ == "__main__": calculator()\n\nاجرا: python calculator.py';}
function answer(raw){
const q=norm(raw);if(!q)return 'پیامت خالیه؛ چیزی بنویس تا با هم صحبت کنیم.';
if(has(q,['سلام','درود','صبح بخیر','عصر بخیر','hello','hi ','hey']))return 'سلام! 😊 خوش اومدی. من خوبم و آماده‌ام کمکت کنم. تو چطوری؟';
if(has(q,['خوبی','خوب هستی','چطوری','حالت چطوره','چه خبر','how are you']))return 'ممنون که پرسیدی! 😊 من خوبم و آماده‌ام باهات گپ بزنم. تو خوبی؟';
if(has(q,['اسمت چیه','اسم تو','نامت چیه','کی هستی','who are you','your name']))return 'من VELTRIX AI هستم؛ یک دستیار گفت‌وگویی فارسی و انگلیسی که در حال توسعه است.';
if(has(q,['چند سالته','سن تو']))return 'من انسان نیستم و سن واقعی ندارم؛ VELTRIX AI یک پروژه نرم‌افزاری است.';
if(has(q,['ممنون','مرسی','دمت گرم','سپاس','متشکرم','thank you','thanks']))return 'خواهش می‌کنم! 🌟 خوشحالم که تونستم کمک کنم.';
if(has(q,['ببخشید','معذرت','شرمنده']))return 'اشکالی نداره 😊 بگو ببینم چطور می‌تونم کمک کنم.';
if(has(q,['خداحافظ','بای','فعلا','فعلاً','goodbye','bye']))return 'فعلاً! 👋 هر وقت خواستی برگرد تا دوباره گپ بزنیم.';
if(has(q,['دوستت دارم','عاشقتم']))return 'چه مهربون! 💙 من احساس انسانی ندارم، ولی با کمال میل همراه و کمکت می‌کنم.';
if(has(q,['جوک','شوخی','بخندون']))return 'یه برنامه‌نویس گفت کدم بدون باگ اجرا شد! دوستش گفت: پس هنوز اجراش نکردی! 😄';
if(has(q,['سایت','وبسایت','وب سایت','website'])&&has(q,['برنامه نویسی','برنامه‌نویسی','کدنویسی','coding','code']))return 'برای برنامه‌نویسی این سایت‌ها مفیدن:\n\n1) freeCodeCamp: https://www.freecodecamp.org/\n2) MDN: https://developer.mozilla.org/\n3) W3Schools: https://www.w3schools.com/\n4) GitHub: https://github.com/\n\nاگر بگی با گوشی کار می‌کنی یا کامپیوتر و چه زبانی می‌خوای، دقیق‌تر پیشنهاد می‌دم.';
if(has(q,['سایت','وبسایت','وب سایت','website']))return 'حتماً! چند سایت مفید:\n\n• آموزش رایگان: https://www.khanacademy.org/\n• دانشنامه: https://www.wikipedia.org/\n• یادگیری برنامه‌نویسی: https://www.freecodecamp.org/\n• ویرایشگر تصویر آنلاین: https://www.photopea.com/\n\nدنبال سایت در چه زمینه‌ای هستی؟';
if(has(q,['کد','کدنویسی','برنامه نویسی','برنامه‌نویسی','code','coding','پایتون','python','html','javascript','جاوا'])){
if(has(q,['خطا','ارور','باگ','error','debug','کار نمیکنه','کار نمی کنه']))return 'حتماً بررسی می‌کنم. کل کد، متن دقیق خطا و بگو انتظار داشتی چه اتفاقی بیفته. بدون دیدن کد و خطا علت را حدس نمی‌زنم.';
if(has(q,['سایت','صفحه وب','وبسایت','وب سایت']))return websiteCode();
if(has(q,['ماشین حساب','calculator','پایتون','python']))return pythonCode();
return 'می‌تونم نمونه‌کد آموزشی و راهنمایی برنامه‌نویسی ارائه کنم؛ اما هنوز موتور کدنویسی پیشرفته‌ای ندارم که پروژه بزرگ را خودکار بسازد، اجرا کند و همه خطاهایش را رفع کند.\n\nبرای شروع، بگو چه چیزی می‌سازی، با چه زبان یا فناوری، چه قابلیت‌هایی می‌خواهی و خروجی وب است یا اندروید یا دسکتاپ؟';
}
if(has(q,['قابلیت','چه کار','چه کاری','کمک میکنی','کمک می کنی']))return 'می‌تونم گفت‌وگوی روزمره داشته باشم، سایت معرفی کنم، نمونه‌کدهای آموزشی بسازم و درباره خطاهای رایج راهنمایی بدم. برای پاسخ‌گویی عمومی پیشرفته و ساخت خودکار پروژه به مدل زبانی واقعی و ابزار اجرای کد نیاز داریم.';
if(has(q,['خوبم','من خوبم','عالی ام','عالی‌ام']))return 'چه عالی! 😄 امروز دوست داری درباره چی صحبت کنیم؟';
if(has(q,['خبر','اخبار','news']))return 'برای خبرهای تازه باید جستجوی وب انجام بشه. حالت جستجوی اینترنت رو روشن کن و موضوع خبر رو بنویس.';
return 'می‌خوام درست راهنمایی‌ات کنم، ولی این نسخه هنوز مدل زبانی عمومی و فهم عمیق متن نداره. لطفاً سؤال رو کمی دقیق‌تر بنویس یا موضوعش رو مشخص کن.';
}
function send(text){const value=(text??input.value).trim();if(!value)return;add(value,'user');input.value='';setTimeout(()=>add(answer(value),'bot'),120);}
form.addEventListener('submit',e=>{e.preventDefault();send();});
document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>send(b.dataset.prompt)));
</script></body></html>
